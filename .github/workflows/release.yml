name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  select-mode:
    if: github.repository == 'nerdslabs/teiler'
    needs: [tests]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Select mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: [select-mode]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Create Release Pull Request
        uses: changesets/action/version@v2
        with:
          script: pnpm changeset:version

  publish:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install Dependencies
        run: pnpm install
      - name: Build
        run: pnpm build
      - name: Publish to npm
        uses: changesets/action/publish@v2
        with:
          script: pnpm changeset:publish
