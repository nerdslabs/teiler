name: Tests

on:
  workflow_call:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Run tests
        run: pnpm test -- --coverage
  storybook-svelte:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install Dependencies
        run: |
          pnpm install
          pnpm playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: Run tests
        run: |
          cd packages/svelte
          pnpm dlx concurrently -k -s first -n "STORYBOOK,TEST" -c "magenta,blue" \
            "pnpm storybook" \
            "pnpm dlx wait-on tcp:6006 && pnpm test-storybook --url http://localhost:6006"
  storybook-vue:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install Dependencies
        run: |
          pnpm install
          pnpm playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: Run tests
        run: pnpm --filter @teiler/vue storybook-test
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Run tests
        run: pnpm lint
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Run tests
        run: pnpm check-format
